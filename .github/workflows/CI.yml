name: CI

on: [ push, pull_request ]

jobs:

  build:
    name: Build
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    env:
      GRADLE_OPTS: "-Dfile:encoding=UTF-8"

    steps:
      - name: Cache glslang
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/runelite
          key: ${{ runner.os }}-cache-${{ hashFiles('ci/build.sh') }}
          restore-keys: |
            ${{ runner.os }}-cache-

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Build and Test
        run: ./ci/build.sh

      - name: Check generated obfuscation values
        run: |
          ./scripts/update-obfuscation-values.sh
          if ! git diff --exit-code -- docs/DETECTION_HARDENING.md docs/obfuscation hwid-agent/historical-clients.txt runelite-client/src/main/resources/net/runelite/client/plugins/microbot/util/reflection/menu-action-info.properties; then
            echo "::error::Generated obfuscation values are stale. Run scripts/update-obfuscation-values.sh and commit the result."
            exit 1
          fi
